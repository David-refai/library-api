# =========================================
# Test configuration — H2 in-memory DB
# =========================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Swagger in tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Disable Vault and Caching in tests
spring.cloud.vault.enabled=false
spring.cache.type=none
rate.limit.capacity=1000

# Security — fixed, deterministic values for integration tests
jwt.secret=test-only-secret-key-for-integration-tests-do-not-reuse
jwt.expiration-ms=3600000
app.security.admin-username=admin
app.security.admin-password=admin-changeit
app.security.user-username=user
app.security.user-password=user-changeit

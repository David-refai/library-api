# =========================================
# Server
# =========================================
server.port=7070

# =========================================
# H2 Database
# =========================================
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# =========================================
# JPA / Hibernate
# =========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================
# OpenAPI / Swagger
# =========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# =========================================
# Spring Vault
# =========================================
spring.cloud.vault.enabled=false
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.token=root
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.authentication=TOKEN
# spring.config.import=vault://

# =========================================
# Optimization & Rate Limiting
# =========================================
spring.cache.type=simple
rate.limit.capacity=100

# =========================================
# Security — JWT & in-memory accounts
# =========================================
# JWT_SECRET MUST be overridden via an environment variable in any real
# deployment (e.g. `docker run -e JWT_SECRET=...`). The fallback below is
# only good enough for local development and exists so the app can start
# without extra setup.
jwt.secret=${JWT_SECRET:dev-only-secret-key-do-not-use-in-production-min-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Credentials for the two in-memory accounts (admin/user). Override via
# environment variables in any non-local environment.
app.security.admin-username=${ADMIN_USERNAME:admin}
app.security.admin-password=${ADMIN_PASSWORD:admin-changeit}
app.security.user-username=${USER_USERNAME:user}
app.security.user-password=${USER_PASSWORD:user-changeit}

# =========================================
# Logging
# =========================================
logging.level.se.chasacademy=DEBUG
logging.level.org.springframework.web=INFO
